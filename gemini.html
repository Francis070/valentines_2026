<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft Pinkish Light Background */
            background: linear-gradient(-45deg, #fff0f3, #ffccd5, #fff0f3, #ffb3c1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            animation: floatUp linear forwards;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 5px rgba(255,192,203,0.5));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 77, 109, 0.2);
            text-align: center;
            width: 380px;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #fff;
        }

        .gif-area {
            max-height: 0;
            opacity: 0;
            transition: all 0.6s ease;
            margin-bottom: 0;
        }

        .gif-area.show {
            max-height: 250px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .gif-area img { width: 180px; border-radius: 20px; }

        h1 {
            font-family: 'Indie Flower', cursive;
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.3s, width 0.4s, height 0.4s, font-size 0.4s, opacity 2s, filter 2s;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            animation: heartbeat 1.2s infinite ease-in-out;
        }

        #yesBtn:hover {
            background-color: #ff758f;
            animation: none;
            transform: scale(1.5);
        }

        /* NO BUTTON: Brown & Melting logic */
        #noBtn {
            background-color: #795548; /* Brown color */
            color: white;
            position: relative;
            transition: top 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), 
                        left 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28),
                        transform 0.4s ease,
                        border-radius 2s ease;
        }

        /* The Melting Animation */
        .melting {
            filter: blur(2px) brightness(0.8);
            border-radius: 50% 50% 20% 20% !important;
            transform: scaleY(0.5) translateY(20px) !important;
            opacity: 0;
            pointer-events: none; /* Can't click while melting */
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="gif-area" id="gifArea">
            <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy Bears">
        </div>
        
        <h1 id="questionText">Will you be my Valentine?</h1>
        
        <div class="btn-container" id="btnWrapper">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const heartColors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ffffff'];
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            // setTimeout(() => heart.remove(), 5000);
        }, 200);

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gifArea = document.getElementById('gifArea');
        const mainCard = document.getElementById('mainCard');
        const questionText = document.getElementById('questionText');
        const btnWrapper = document.getElementById('btnWrapper');

        // Logic to move and shrink the 'No' button
        function moveNo() {
            const randomScale = Math.random() * (1.0 - 0.4) + 0.4;
            noBtn.style.transform = `scale(${randomScale})`;

            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50) + 25;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50) + 25;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        noBtn.addEventListener('mouseenter', moveNo);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNo(); });

        // --- MELTING LOGIC ---
        // After 2 minutes (120,000 milliseconds)
        // setTimeout(() => {
        //     noBtn.classList.add('melting');
        //     // Remove from DOM after the 2s fade-out transition finishes
        //     setTimeout(() => {
        //         noBtn.style.display = 'none';
        //     }, 2000);
        // }, 12000); 

        // Yes Button Click
        yesBtn.addEventListener('click', () => {
            gifArea.classList.add('show');
            questionText.innerHTML = "Yay! You're mine now, Jaan! ❤️";
            btnWrapper.classList.add('hidden');
            mainCard.style.width = "420px";

            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ffffff'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        });
    </script>
</body>
</html>

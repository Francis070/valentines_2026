<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: 'Pacifico', cursive;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Floating hearts */
.heart {
  position: absolute;
  pointer-events: none;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0.6); opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* Card */
.card {
  background: rgba(255,255,255,0.95);
  padding: 30px 40px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  max-width: 90%;
  z-index: 2;
}

h1 {
  text-align: center;
  font-size: clamp(26px, 5vw, 42px);
  color: #ff2e63;
  margin-bottom: 35px;
}

/* Buttons container */
.buttons {
  display: flex;
  align-items: center;
  justify-content: flex-start; /* YES stays left */
  gap: 40px;
  position: relative;
}

/* Buttons */
button {
  font-size: clamp(18px, 4vw, 22px);
  padding: 14px 34px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  white-space: nowrap;
}

/* YES button */
#yesBtn {
  background: #ff2e63;
  color: white;
  transition: transform 0.15s ease-out;
  z-index: 5;
}

/* NO button */
#noBtn {
  background: #555;
  color: white;
  transition: transform 0.2s ease-out;
  z-index: 10;
}

/* Happy message */
.happy {
  display: none;
  text-align: center;
  font-size: clamp(22px, 5vw, 36px);
  color: #ff2e63;
}

/* Confetti */
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">
  <h1 id="question">Will you be my Valentine? 💖</h1>

  <!-- INITIAL SIDE-BY-SIDE LAYOUT -->
  <div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😝</button>
  </div>

  <div class="happy" id="happyMsg">
    Yayyy!!! 💕🎉<br>
    You made me the happiest 🥰
  </div>
</div>

<script>
/* Floating hearts */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 12 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 250);

/* Elements */
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

/* Convert NO button to fixed AFTER initial layout */
function lockInitialPositions() {
  const noRect = noBtn.getBoundingClientRect();

  noBtn.style.position = "fixed";
  noBtn.style.left = noRect.left + "px";
  noBtn.style.top = noRect.top + "px";
}
window.addEventListener("load", lockInitialPositions);
window.addEventListener("resize", lockInitialPositions);

/* Mouse interaction */
document.addEventListener("mousemove", (e) => {
  const mouseX = e.clientX;
  const mouseY = e.clientY;

  /* YES grows near cursor */
  const yesRect = yesBtn.getBoundingClientRect();
  const yesCX = yesRect.left + yesRect.width / 2;
  const yesCY = yesRect.top + yesRect.height / 2;
  const yesDist = Math.hypot(mouseX - yesCX, mouseY - yesCY);

  const scale = Math.max(1, 1.4 - yesDist / 300);
  yesBtn.style.transform = `scale(${scale})`;

  /* NO escapes */
  const noRect = noBtn.getBoundingClientRect();
  const noCX = noRect.left + noRect.width / 2;
  const noCY = noRect.top + noRect.height / 2;
  const noDist = Math.hypot(mouseX - noCX, mouseY - noCY);

  if (noDist < 120) {
    const angle = Math.atan2(noCY - mouseY, noCX - mouseX);
    let newX = noRect.left + Math.cos(angle) * 160;
    let newY = noRect.top + Math.sin(angle) * 160;

    newX = Math.max(10, Math.min(window.innerWidth - noRect.width - 10, newX));
    newY = Math.max(10, Math.min(window.innerHeight - noRect.height - 10, newY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";
  }
});

/* YES click */
const question = document.getElementById("question");
const buttons = document.querySelector(".buttons");
const happyMsg = document.getElementById("happyMsg");

yesBtn.addEventListener("click", () => {
  question.style.display = "none";
  buttons.style.display = "none";
  happyMsg.style.display = "block";
  startConfetti();
});

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let confetti = [];

function startConfetti() {
  for (let i = 0; i < 300; i++) {
    confetti.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 2,
      d: Math.random() * 5 + 1,
      color: `hsl(${Math.random() * 360},100%,50%)`
    });
  }
  animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confetti.forEach(p => {
    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.y += p.d;
    if (p.y > canvas.height) p.y = 0;
  });
  requestAnimationFrame(animateConfetti);
}
</script>

</body>
</html>
